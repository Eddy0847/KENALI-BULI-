<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operasi Perisai: Buli Fizikal</title><style>:root{--cyan:#32dfff;--gold:#ffd44e;--bg:#061020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#164878,#061020 65%);color:#edf8ff;font-family:system-ui,Segoe UI,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 96%,#1ddaff12 97%),linear-gradient(90deg,transparent 96%,#1ddaff12 97%);background-size:45px 45px}main{max-width:940px;margin:auto;padding:22px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{color:var(--cyan);font-weight:900;letter-spacing:3px}.pill{border:1px solid #2c9eb7;border-radius:30px;padding:9px 15px;background:#0a223c}.panel{margin-top:24px;border:1px solid #238bb3;border-radius:22px;background:#071b33eb;box-shadow:0 0 40px #00cfff24;padding:clamp(18px,4vw,38px)}h1{font-size:clamp(32px,6vw,60px);line-height:1.05;margin:14px 0;text-shadow:0 0 22px #05b7f888}h2{font-size:clamp(23px,4vw,34px)}p{line-height:1.65;color:#d1e6f7}.gold{color:var(--gold)}button{cursor:pointer;border:1px solid #35b7e3;background:#103555;color:white;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:800;transition:.15s}button:hover,button:focus-visible{transform:translateY(-2px);box-shadow:0 0 18px #23c9f977;outline:2px solid #8feaff}button.primary{background:linear-gradient(110deg,#e03a35,#a31330);border-color:#ff6969;font-size:20px}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:#0c2946;border:1px solid #235e85;border-radius:16px;padding:17px}.card strong{color:var(--gold)}.scene{border:1px solid #3576a2;background:linear-gradient(130deg,#17416a,#10223b);padding:20px;border-radius:16px;font-size:21px;font-weight:700;margin:16px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{text-align:left;min-height:78px}.answers button:disabled{cursor:default;opacity:.75;transform:none}.answers .correct{background:#145b45;border-color:#3cffa7;opacity:1}.answers .wrong{background:#642434;border-color:#ff7180;opacity:1}.feedback{padding:17px;margin-top:16px;border-radius:12px;background:#102e47;border-left:5px solid var(--gold)}.bar{height:13px;border-radius:20px;background:#153c56;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#19c5ff,#fbd84e);transition:width .3s}.muted{color:#a5bfd2}.badge{display:inline-block;background:#163b5b;color:#76eaff;border-radius:20px;padding:7px 12px;font-weight:700}.hidden{display:none}.cert{text-align:center;border:2px solid #e5b94a;border-radius:20px;padding:25px;background:linear-gradient(130deg,#0b2d4a,#122b34)}input{padding:14px;border-radius:10px;border:1px solid #55c4e6;background:#071c32;color:white;font-size:17px;max-width:100%;width:320px}@media(max-width:620px){.answers{grid-template-columns:1fr}.top{flex-wrap:wrap}}@media print{body{background:white;color:black}body:before,.top,.noprint{display:none!important}.panel,.cert{box-shadow:none;background:white;color:black;border-color:#777}p{color:black}}</style></head><body><main><header class="top"><div class="tag">◈ AKADEMI EJEN · UNIT PERISAI</div><div class="pill" id="score">⭐ 0 MATA</div></header><section class="panel" id="app"></section></main><script>
const missions=[{name:'KENAL PASTI ANCAMAN',icon:'🔍',desc:'Kenal pasti perlakuan buli fizikal.',questions:[['Di koridor, seorang murid sengaja menolak rakan yang sama berulang kali untuk menakutkannya. Apakah ini?',['Buli fizikal','Permainan biasa','Buli siber','Kemalangan'],0,'Menolak seseorang dengan sengaja untuk menyakiti atau menakutkan boleh menjadi buli fizikal.'],['Antara berikut, yang manakah contoh buli fizikal?',['Mengucapkan selamat pagi','Membantu mengangkat buku','Menendang rakan dengan sengaja','Mengajak bermain'],2,'Menendang dengan sengaja ialah perbuatan fizikal yang menyakitkan.'],['Dua murid tidak sengaja terlanggar semasa berlari, lalu meminta maaf. Adakah ini semestinya buli?',['Ya, semua perlanggaran ialah buli','Tidak, kejadian tidak sengaja bukan semestinya buli','Ya, jika berlaku di sekolah','Ya, jika mereka berlari'],1,'Lihat niat, konteks dan corak kejadian. Kemalangan tidak semestinya buli.']]},{name:'KESAN KEPADA MANGSA',icon:'💛',desc:'Fahami kesan dan perasaan mangsa.',questions:[['Apakah kemungkinan kesan buli fizikal kepada murid?',['Berasa lebih selamat','Takut datang ke sekolah','Sentiasa gembira','Lebih yakin secara automatik'],1,'Mangsa mungkin berasa takut, sedih dan tidak selamat.'],['Rakan yang ditolak kelihatan sedih dan menjauhkan diri. Apakah sikap terbaik?',['Mengejeknya','Mengabaikan perasaannya','Mendengar dan menemaninya ke guru','Menyebarkan cerita'],2,'Sokongan yang baik membantu rakan berasa didengari dan mendapatkan bantuan.']]},{name:'TINDAKAN EJEN',icon:'🛡️',desc:'Pilih tindakan yang selamat.',questions:[['Kamu melihat murid ditendang berhampiran kantin. Apakah tindakan paling selamat?',['Membalas tendangan','Menonton sahaja','Meminta bantuan guru dengan segera','Merakam untuk ditularkan'],2,'Utamakan keselamatan. Dapatkan bantuan guru atau orang dewasa yang dipercayai.'],['Seorang pembuli mengugut untuk menolak kamu. Apa yang patut dilakukan?',['Pergi ke tempat selamat dan maklumkan guru','Mencabarnya bergaduh','Simpan rahsia selama-lamanya','Menolak semula'],0,'Jauhkan diri daripada bahaya dan beritahu orang dewasa yang boleh membantu.'],['Rakan meminta kamu merahsiakan kejadian dia dipukul. Apa tindakan terbaik?',['Janji tidak akan memberitahu sesiapa','Beritahu guru secara berhati-hati supaya dia dibantu','Sebarkan dalam kumpulan kelas','Salahkan rakan itu'],1,'Keselamatan lebih penting. Jelaskan bahawa mendapatkan bantuan ialah tindakan menjaga rakan.']]},{name:'SIASATAN SEKOLAH',icon:'🧩',desc:'Nilai bukti dan tindakan.',questions:[['Seorang murid sering merampas beg rakan dan menolaknya. Apakah petunjuk penting?',['Perbuatan berulang yang menyakitkan dan menakutkan','Warna beg','Hari dalam minggu','Bilangan buku'],0,'Perbuatan sengaja yang berulang dan melibatkan ketidakseimbangan kuasa ialah petunjuk buli.'],['Guru bertanya apa yang kamu lihat. Bagaimanakah kamu patut menjawab?',['Menambah cerita supaya menarik','Bercakap benar tentang apa yang dilihat','Menyalahkan mangsa','Diam kerana takut diejek'],1,'Berikan maklumat yang benar dan tepat kepada guru.']]},{name:'UJIAN EJEN AKHIR',icon:'🏆',desc:'Buktikan kemahiran melindungi rakan.',questions:[['Kamu melihat murid lebih besar menghalang murid lain dan menolaknya. Apakah urutan tindakan terbaik?',['Menjerit dan menyerang','Pastikan diri selamat, dapatkan guru, sokong mangsa','Ambil video dan kongsi','Tunggu sehingga tamat'],1,'Utamakan keselamatan, dapatkan bantuan dan beri sokongan tanpa membahayakan diri.'],['Apakah mesej paling penting tentang buli fizikal?',['Buli ialah gurauan biasa','Mangsa patut membalas','Buli tidak wajar; kita perlu bertindak dengan selamat dan mendapatkan bantuan','Hanya murid kuat boleh membantu'],2,'Setiap murid boleh membantu menghentikan buli melalui tindakan yang selamat.']]}];
const total=missions.reduce((n,m)=>n+m.questions.length,0);let stage=-1,q=0,points=0,answered=false;const app=document.getElementById('app');const score=document.getElementById('score');function beep(ok){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?660:240;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}catch(e){}}function update(){score.textContent='⭐ '+points+' MATA'}function home(){stage=-1;app.innerHTML=`<span class="badge">🔴 AKSES MISI DIBENARKAN</span><h1>OPERASI <span class="gold">PERISAI</span><br>BULI FIZIKAL</h1><p>Selamat datang, Ejen! Sekolah memerlukan bantuan kamu. Selesaikan lima misi untuk mengenal pasti buli fizikal, memahami kesannya dan melindungi rakan dengan selamat.</p><div class="grid"><div class="card">🎯 <strong>5 MISI</strong><p>Cabaran bertahap</p></div><div class="card">🧠 <strong>${total} SOALAN</strong><p>Situasi sekolah rendah</p></div><div class="card">🏅 <strong>SIJIL EJEN</strong><p>Selepas tamat misi</p></div></div><div class="row"><button class="primary" onclick="map()">🚀 MULAKAN OPERASI</button><button onclick="rules()">📘 CARA BERMAIN</button></div>`}function rules(){app.innerHTML=`<h2>📘 PROTOKOL EJEN</h2><p>Baca situasi dan pilih satu jawapan. Setiap jawapan betul mendapat <b>10 mata</b>. Jika tersilap, baca penjelasan dan teruskan. Lengkapkan kelima-lima misi untuk mendapat sijil.</p><p>⚠️ Jangan melawan secara fizikal atau cuba menyelesaikan kejadian berbahaya sendirian. Dapatkan bantuan guru atau orang dewasa yang dipercayai.</p><button class="primary" onclick="map()">FAHAM, TERUSKAN ➜</button>`}function map(){app.innerHTML=`<span class="badge">PUSAT KAWALAN</span><h2>🛰️ PILIH MISI</h2><p>Lengkapkan semua misi mengikut urutan.</p><div class="grid">${missions.map((m,i)=>`<div class="card"><div style="font-size:32px">${m.icon}</div><h3 class="gold">MISI ${i+1}: ${m.name}</h3><p>${m.desc}</p><button onclick="start(${i})" ${i>Math.max(stage+1,0)?'disabled':''}>${i<=stage?'🔁 ULANG MISI':i===stage+1?'▶ MULAKAN':'🔒 TERKUNCI'}</button></div>`).join('')}</div>`}function start(i){stage=i;q=0;question()}function question(){answered=false;const m=missions[stage],item=m.questions[q],done=missions.slice(0,stage).reduce((n,x)=>n+x.questions.length,0)+q;app.innerHTML=`<div class="top"><span class="badge">${m.icon} MISI ${stage+1} / 5</span><span class="muted">SOALAN ${done+1} / ${total}</span></div><h2 class="gold">${m.name}</h2><div class="bar"><div class="fill" style="width:${done/total*100}%"></div></div><div class="scene">📡 ${item[0]}</div><p>Apakah jawapan ejen?</p><div class="answers">${item[1].map((a,i)=>`<button id="a${i}" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${a}</button>`).join('')}</div><div id="feedback"></div>`}function answer(i){if(answered)return;answered=true;const item=missions[stage].questions[q],ok=i===item[2];if(ok)points+=10;update();beep(ok);item[1].forEach((_,j)=>{let b=document.getElementById('a'+j);b.disabled=true;if(j===item[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'✅ TEPAT, EJEN! +10 MATA':'⚠️ BELUM TEPAT, EJEN!'}</strong><p>${item[3]}</p><button class="primary" onclick="next()">${q+1===missions[stage].questions.length?'SELESAIKAN MISI':'SOALAN SETERUSNYA'} ➜</button></div>`}function next(){q++;if(q<missions[stage].questions.length){question();return}if(stage===missions.length-1){finish();return}app.innerHTML=`<h1>✅ MISI ${stage+1} SELESAI!</h1><p>Bagus, Ejen! Kamu semakin mahir mengenal pasti dan menangani buli fizikal dengan selamat.</p><p class="gold">⭐ Markah terkumpul: ${points}</p><button class="primary" onclick="start(${stage+1})">🚀 MISI SETERUSNYA</button>`}function finish(){const rank=points>=100?'EJEN CEMERLANG':points>=70?'EJEN CEKAP':'EJEN PELATIH';app.innerHTML=`<div class="cert"><div style="font-size:55px">🏆</div><h1>OPERASI SELESAI!</h1><p>TAHNIAH! ANDA TELAH MENAMATKAN LATIHAN ANTI-BULI FIZIKAL.</p><h2 class="gold">${rank}</h2><h2>⭐ ${points} / ${total*10} MATA</h2><p>Ingat: lindungi diri, bantu rakan dengan selamat dan laporkan buli kepada guru atau orang dewasa yang dipercayai.</p><label for="agent">Nama ejen (pilihan):</label><br><input id="agent" maxlength="45" placeholder="Masukkan nama ejen"><p id="named"></p></div><div class="row noprint"><button onclick="document.getElementById('named').textContent='Ejen: '+(document.getElementById('agent').value.trim()||'Ejen Pelindung');window.print()">🖨️ CETAK SIJIL</button><button class="primary" onclick="reset()">🔄 MAIN SEMULA</button></div>`}function reset(){stage=-1;q=0;points=0;update();home()}home();</script></body></html>
